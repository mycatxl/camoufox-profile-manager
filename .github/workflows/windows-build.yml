name: Windows build

# Auto-builds the standalone Windows desktop app so the newest state of `main`
# always has a downloadable zip.
#
# Every push to main produces two things:
#   1. an Actions artifact named with the version + commit — traceability, kept
#      90 days;
#   2. the rolling release `latest-win`, whose single asset keeps a *stable*
#      filename, so its download URL never changes.
#
# Windows only on purpose: `desktop.yml` keeps the manual, cross-platform builds
# (macOS/Windows/Linux). PyInstaller does not cross-compile, so the Windows
# bundle needs a windows-latest runner — and nothing else is wanted here.
#
# The Camoufox browser binary is NOT bundled; it is fetched on first run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also attach the zip to this release tag (optional)"
        required: false
        default: ""

# One build per ref: a newer push supersedes an in-flight build.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

# Needed to create/update releases and their git tags. Checkout and the artifact
# upload work with the default read token.
permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the app version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          if (-not $line) { throw "Could not find a version in pyproject.toml" }
          $version = $line.Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra build

      # Builds the web UI into src/camoufox_pm/webui, then runs PyInstaller.
      - name: Build the desktop app
        run: uv run python scripts/build_desktop.py

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $exe = "dist/camoufox-pm/camoufox-pm.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no $exe" }

          $zip = "dist/camoufox-pm-$version-windows-x64.zip"
          Compress-Archive -Path "dist/camoufox-pm/*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Packaged $zip ($mb MB, sha256 $hash)"

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

          @(
            "## Windows desktop build $version",
            "",
            "| Field | Value |",
            "|---|---|",
            "| File | ``$zip`` |",
            "| Size | $mb MB |",
            "| SHA256 | ``$hash`` |",
            "| Commit | ``${{ github.sha }}`` |",
            "| Trigger | ${{ github.event_name }} |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camoufox-pm-${{ steps.version.outputs.value }}-windows-x64-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      # The rolling release carries a stable filename, so its URL is fixed. The
      # version-stamped copy above stays as the artifact.
      - name: Stage the rolling asset
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rolling | Out-Null
          Copy-Item "${{ steps.package.outputs.zip }}" rolling/camoufox-pm-windows-x64.zip

      - name: Update the rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-win
          name: Latest Windows build (rolling)
          # Keep the "Latest" badge on the versioned releases; this one is a
          # moving target, not a published version.
          make_latest: false
          body: |
            Rolling build of the newest `main`. The asset below is overwritten on
            every push, and its filename never changes — so this link is stable.

            | | |
            |---|---|
            | Version | ${{ steps.version.outputs.value }} |
            | Commit | ${{ github.sha }} |
            | SHA256 | ${{ steps.package.outputs.sha256 }} |

            **How to run it:** download `camoufox-pm-windows-x64.zip`, unzip the
            whole archive, and start `camoufox-pm.exe` from inside the unzipped
            folder — the executable needs the `_internal/` directory next to it.

            The build is unsigned, so Windows SmartScreen asks once
            ("More info" → "Run anyway"). The Camoufox browser itself is
            downloaded on first run.
          files: rolling/*.zip

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*.zip
