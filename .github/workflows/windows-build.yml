name: Windows build

# Auto-builds the standalone Windows desktop app so the newest state of `main`
# always has a downloadable zip.
#
# Every push to main produces two things:
#   1. an Actions artifact named with the version + commit — traceability, kept
#      90 days;
#   2. the release `latest-win`, this repository's single download: one asset, a
#      stable filename, so its URL never changes.
#
# Windows only on purpose: `desktop.yml` keeps the manual, cross-platform builds
# (macOS/Windows/Linux). PyInstaller does not cross-compile, so the Windows
# bundle needs a windows-latest runner — and nothing else is wanted here.
#
# The browser, the GeoIP databases and the addons are not part of the PyInstaller
# bundle; they are installed into the package directory in their own step below,
# so the zip is complete the moment it is unzipped.

on:
  push:
    branches: [main]
  # A manual rebuild of the same thing, for when a run failed for reasons that
  # had nothing to do with the commit.
  workflow_dispatch:

# One build per ref: a newer push supersedes an in-flight build.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

# Needed to create/update releases and their git tags. Checkout and the artifact
# upload work with the default read token.
permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the app version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          if (-not $line) { throw "Could not find a version in pyproject.toml" }
          $version = $line.Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra build

      # Builds the web UI into src/camoufox_pm/webui, then runs PyInstaller.
      - name: Build the desktop app
        run: uv run python scripts/build_desktop.py

      # The browser is far too large for the PyInstaller bundle, but the point of
      # this build is to be unzipped and run. Install it, the GeoIP databases and
      # the default addons into the package's own cache directory — the one
      # launch.py points at — so the folder ships complete and the first launch
      # needs no network at all.
      #
      # Both commands are checked on their own: a multi-line `run:` block reports
      # the exit code of its last command only, which is how a failed fetch once
      # shipped a 111 MB package whose release notes promised a browser.
      # GITHUB_TOKEN is what that fetch needs — listing the available builds goes
      # through the GitHub API, runners share an address, and the anonymous limit
      # (60 calls an hour) is easily spent by whatever ran on that machine first.
      - name: Install the browser and its data into the package
        shell: pwsh
        env:
          WIN_PD_OVERRIDE_LOCAL_APPDATA: ${{ github.workspace }}\dist\camoufox-pm\portable
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run camoufox-pm fetch
          if ($LASTEXITCODE -ne 0) { throw "camoufox-pm fetch failed with exit code $LASTEXITCODE" }
          uv run python packaging/prefetch_data.py
          if ($LASTEXITCODE -ne 0) { throw "packaging/prefetch_data.py failed with exit code $LASTEXITCODE" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $exe = "dist/camoufox-pm/camoufox-pm.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no $exe" }

          # PE subsystem 3 is console, 2 is GUI. The console is deliberate: on
          # Windows that window is the only visible handle on a running server, so
          # it is also how the app gets stopped. Asserted because the difference is
          # invisible to every other check here and only shows up when a person runs
          # the thing — a windowed build leaves a process nobody can find.
          $pe = [System.IO.File]::ReadAllBytes($exe)
          $subsystem = [System.BitConverter]::ToUInt16($pe, [System.BitConverter]::ToInt32($pe, 0x3C) + 0x5C)
          if ($subsystem -ne 3) { throw "$exe has PE subsystem $subsystem; expected 3 (console window — the handle you close to stop the app)" }
          Write-Host "Verified: $exe is a console binary, so closing its window stops the app"

          $zip = "dist/camoufox-pm-$version-windows-x64.zip"
          # The package promises to be "unzip and run", so the parts that make
          # that true are asserted rather than assumed: the browser profiles are
          # launched with, the GeoIP databases a timezone is pinned from, and the
          # addon. Downloading them can silently do nothing — see the exit-code
          # note above — and the result is only visible to whoever unzips it.
          $bundle = "dist/camoufox-pm/portable/camoufox/camoufox/Cache"
          $browser = @(Get-ChildItem "$bundle/browsers" -Recurse -Filter camoufox.exe -ErrorAction SilentlyContinue)
          $geoip = @(Get-ChildItem "$bundle/geoip" -Recurse -Filter "*.mmdb" -ErrorAction SilentlyContinue)
          $addons = @(Get-ChildItem "$bundle/addons" -Recurse -File -ErrorAction SilentlyContinue)
          if ($browser.Count -lt 1) { throw "the package has no browser in it: nothing to launch profiles with" }
          if ($geoip.Count -lt 2) { throw "expected the GeoLite2 ipv4 and ipv6 databases, found $($geoip.Count)" }
          if ($addons.Count -lt 100) { throw "expected the default addons, found $($addons.Count) files" }
          Write-Host "Verified: bundled browser, $($geoip.Count) GeoIP databases, $($addons.Count) addon files"

          Compress-Archive -Path "dist/camoufox-pm/*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Packaged $zip ($mb MB, sha256 $hash)"

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "mb=$mb" >> $env:GITHUB_OUTPUT

          @(
            "## Windows desktop build $version",
            "",
            "| Field | Value |",
            "|---|---|",
            "| File | ``$zip`` |",
            "| Size | $mb MB |",
            "| SHA256 | ``$hash`` |",
            "| Commit | ``${{ github.sha }}`` |",
            "| Trigger | ${{ github.event_name }} |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camoufox-pm-${{ steps.version.outputs.value }}-windows-x64-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      # The rolling release carries a stable filename, so its URL is fixed. The
      # version-stamped copy above stays as the artifact.
      - name: Stage the rolling asset
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rolling | Out-Null
          Copy-Item "${{ steps.package.outputs.zip }}" rolling/camoufox-pm-windows-x64.zip

      - name: Update the rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-win
          name: Latest Windows build (rolling)
          # This repository publishes exactly one release, so it carries the
          # "Latest" badge.
          make_latest: true
          body: |
            Windows desktop build of `main`. The asset below is overwritten on
            every push and its filename never changes, so this link is stable.

            **Unzip and run — nothing to install:**

            1. Download `camoufox-pm-windows-x64.zip` and unzip the whole archive.
               Keep the folder intact: `camoufox-pm.exe` needs `_internal/` beside it.
            2. Start `camoufox-pm.exe`.

            The browser, the GeoIP databases and the uBlock Origin addon are all
            inside, so the first launch needs no network.

            Everything the app writes stays in that folder; deleting it is a
            complete uninstall.

            | | |
            |---|---|
            | Version | ${{ steps.version.outputs.value }} |
            | Commit | ${{ github.sha }} |
            | Size | ${{ steps.package.outputs.mb }} MB |
            | SHA256 | `${{ steps.package.outputs.sha256 }}` |

            The build is unsigned, so Windows SmartScreen asks once
            ("More info" → "Run anyway").
          files: rolling/*.zip
