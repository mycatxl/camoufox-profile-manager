name: Windows build

# Auto-builds the standalone Windows desktop app so the newest state of `main`
# always has a downloadable zip in the Actions tab.
#
# Windows only on purpose: `desktop.yml` keeps the manual, cross-platform builds
# (macOS/Windows/Linux). PyInstaller does not cross-compile, so the Windows
# bundle needs a windows-latest runner — and nothing else is wanted here.
#
# The Camoufox browser binary is NOT bundled; it is fetched on first run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also attach the zip to this release tag (optional)"
        required: false
        default: ""

# One build per ref: a newer push supersedes an in-flight build.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` is only needed by the optional "attach to release" step.
# Checkout and the artifact upload work with the default read token.
permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the app version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          if (-not $line) { throw "Could not find a version in pyproject.toml" }
          $version = $line.Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra build

      # Builds the web UI into src/camoufox_pm/webui, then runs PyInstaller.
      - name: Build the desktop app
        run: uv run python scripts/build_desktop.py

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $exe = "dist/camoufox-pm/camoufox-pm.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no $exe" }

          $zip = "dist/camoufox-pm-$version-windows-x64.zip"
          Compress-Archive -Path "dist/camoufox-pm/*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Packaged $zip ($mb MB, sha256 $hash)"

          @(
            "## Windows desktop build $version",
            "",
            "| Field | Value |",
            "|---|---|",
            "| File | ``$zip`` |",
            "| Size | $mb MB |",
            "| SHA256 | ``$hash`` |",
            "| Commit | ``${{ github.sha }}`` |",
            "| Trigger | ${{ github.event_name }} |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camoufox-pm-${{ steps.version.outputs.value }}-windows-x64-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*.zip
